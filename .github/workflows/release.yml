name: Release

# 打一个 v* 标签 → 自动构建 Windows 安装包 + 绿色版 zip，挂到 Release 上。
# 本地打包产物（build/、dist/、release/、*.exe）都在 .gitignore 里，不会进仓库。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v），如 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "v=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      # 硬闸门：tag 必须与 app/version.py 的 VERSION 一致。
      # 不一致时发出去的包会「自己认为自己是旧版」，客户端每次打开都提示更新，
      # 而且只有发布之后才会暴露——比构建失败难查得多。
      - name: Verify tag matches app/version.py
        shell: bash
        run: |
          TAG_VER="${{ steps.ver.outputs.v }}"
          CODE_VER=$(python -c "from app.version import VERSION; print(VERSION)")
          echo "tag=$TAG_VER code=$CODE_VER"
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::tag v$TAG_VER 与 app/version.py 的 $CODE_VER 不一致，拒绝发布"
            exit 1
          fi

      # 闸门：发布必须带变更说明。正文统一从 CHANGELOG.md 抽，抽不到直接失败——
      # 免得用户点进下载页只看到一串 "fix: ..." 的提交标题，不知道该下哪个文件。
      # 放在构建之前，是为了五分钟后才发现漏写说明。
      - name: Generate release notes from CHANGELOG
        run: python scripts/release_notes.py ${{ steps.ver.outputs.v }}

      - name: Run tests (backend)
        run: python -m pytest tests -q

      - name: Build executable (PyInstaller)
        run: pyinstaller FoodieTrail.spec --noconfirm

      # 打包完先在 CI 里跑一次：起 exe → 建记录 → 导出 → 重启验证数据仍在 exe 同级 data/。
      # 这一步在「发出去之前」拦住打坏的包（例如漏了静态资源、数据写到 _MEIPASS）。
      - name: Smoke test packaged build
        run: python scripts/smoke_packaged.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 硬闸门：冒烟测试会真的在 dist/ 里建 data/（库、照片、钥匙、日志），
      # 清理失败或忘了清，安装包就会把这份数据发给所有下载的人。
      # 这里宁可让发布失败，也不让任何一个数据文件进安装包。
      - name: Ensure build output has no user data
        shell: pwsh
        run: |
          $bad = @()
          if (Test-Path "dist\FoodieTrail\data") { $bad += "dist\FoodieTrail\data" }
          # 数据库文件出现在任何层级都算脏（冒烟测试写的库就在 data/ 里）
          $bad += Get-ChildItem "dist\FoodieTrail" -Recurse -File -Include *.db,*.db-wal,*.db-shm `
                   -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          # 日志与加密钥匙只看顶层：_internal 里第三方自带的证书（如 certifi\cacert.pem）是
          # 正常运行依赖，不能一起判失败（第一版闸门就误报了 cacert.pem）
          $bad += Get-ChildItem "dist\FoodieTrail\*.log", "dist\FoodieTrail\*.key" `
                   -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::构建产物含用户数据，拒绝发布：$_" }
            exit 1
          }
          Write-Host "构建产物干净：无 data/、无数据库、无日志、无密钥"

      # 用完整路径调用 ISCC，避免 choco 的 shim 没进 PATH 时静默失败
      - name: Build installer
        shell: cmd
        run: |
          set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" (echo [release] ISCC.exe not found & exit /b 1)
          "%ISCC%" "installer\FoodieTrail.iss" /DMyAppVersion=${{ steps.ver.outputs.v }}

      - name: Build portable zip
        run: python scripts/make_release_zip.py ${{ steps.ver.outputs.v }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Foodie Trail v${{ steps.ver.outputs.v }}
          body_path: release/release-notes.md
          files: |
            installer/Output/FoodieTrail-${{ steps.ver.outputs.v }}-windows-x64-setup.exe
            release/FoodieTrail-${{ steps.ver.outputs.v }}-windows-x64.zip
